name: Deploy Backend to EC2

on:
  push:
    branches: [main]
    paths:
      - "apps/backend/**"
      - "deploy/**"
      - "Dockerfile"
      - ".dockerignore"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/**"

concurrency:
  group: backend-deploy
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-west-2
  AWS_ACCOUNT: "039314424497"
  ECR_REPOSITORY: medusa-backend
  EC2_INSTANCE_ID: i-0d44c4c8141d1454e

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT }}:role/github-actions-chicya-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci --workspace=@dtc/backend --include-workspace-root

      - name: Build backend (medusa build)
        working-directory: apps/backend
        run: npx medusa build

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE="${{ env.AWS_ACCOUNT }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}"
          docker buildx build \
            --platform linux/arm64 \
            --provenance false \
            -t "$IMAGE:$IMAGE_TAG" \
            -t "$IMAGE:latest" \
            --push .
          echo "image=$IMAGE:$IMAGE_TAG" >> "$GITHUB_ENV"

      - name: Deploy via SSM Run Command
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"bash /home/ubuntu/deploy.sh ${{ github.sha }}\"]" \
            --query "Command.CommandId" \
            --output text)
          echo "command-id=$COMMAND_ID"
          sleep 10
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query "Status" \
            --output text
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query "StandardOutputContent" \
            --output text