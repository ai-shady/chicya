name: Deploy Backend to EC2

on:
  push:
    branches: [main]
    paths:
      - "apps/backend/**"
      - "deploy/**"
      - "Dockerfile"
      - ".dockerignore"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  group: backend-deploy
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-west-2
  AWS_ACCOUNT: "039314424497"
  ECR_REPOSITORY: medusa-backend
  EC2_INSTANCE_ID: i-0d44c4c8141d1454e

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT }}:role/github-actions-chicya-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci --workspace=@dtc/backend --include-workspace-root

      - name: Build backend (medusa build)
        working-directory: apps/backend
        run: npx medusa build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE="${{ env.AWS_ACCOUNT }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}"
          docker buildx build \
            --platform linux/arm64 \
            --provenance false \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            -t "$IMAGE:$IMAGE_TAG" \
            -t "$IMAGE:latest" \
            --push .
          echo "image=$IMAGE:$IMAGE_TAG" >> "$GITHUB_ENV"

      - name: Clean up old ECR images
        env:
          IMAGE_TAG: ${{ github.sha }}
          RETENTION: 5
        run: |
          python3 - "${{ env.ECR_REPOSITORY }}" "${{ env.AWS_REGION }}" "${{ env.IMAGE_TAG }}" "$RETENTION" <<'EOF'
          import json, subprocess, sys

          repo, region, this_tag, retention = sys.argv[1], sys.argv[2], sys.argv[3], int(sys.argv[4])

          # Keep: `latest` tag, this run's SHA tag, and the RETENTION most recent
          # tagged images (by push date). Delete everything else, including the
          # untagged layers left behind by `--push`.
          out = subprocess.run(
              ["aws", "ecr", "describe-images", "--repository-name", repo,
               "--region", region,
               "--query", "sort_by(imageDetails,&imagePushedAt)[*].{tags:imageTags,digest:imageDigest}",
               "--output", "json"],
              capture_output=True, text=True, check=True,
          ).stdout
          images = json.loads(out)

          keep = set()
          tagged_keep = 0
          to_delete = []

          for img in reversed(images):  # newest -> oldest
              tags = img.get("tags") or []
              digest = img["digest"]
              if ("latest" in tags) or (this_tag in tags):
                  keep.add(digest)
                  continue
              if tags and tagged_keep < retention:
                  tagged_keep += 1
                  keep.add(digest)
                  continue
              to_delete.append({"imageDigest": digest})

          print(f"keeping {len(keep)} images, deleting {len(to_delete)}")
          if not to_delete:
              sys.exit(0)

          for i in range(0, len(to_delete), 100):
              batch = json.dumps(to_delete[i:i + 100])
              res = subprocess.run(
                  ["aws", "ecr", "batch-delete-image", "--repository-name", repo,
                   "--region", region, "--image-ids", batch, "--output", "json"],
                  capture_output=True, text=True,
              )
              print(res.stdout or res.stderr)
              if res.returncode != 0:
                  sys.exit(res.returncode)
          EOF

      - name: Deploy via SSM Run Command
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE="${{ env.AWS_ACCOUNT }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG"

          # async deploy: run in background so the ~1.5GB pull is not bounded by
          # the ssm-document-worker's ~80s internal timeout
          aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["rm -f /home/ubuntu/deploy.log; nohup bash /home/ubuntu/deploy.sh '"$IMAGE_TAG"' > /home/ubuntu/deploy.log 2>&1 &"]' \
            --query "Command.CommandId" \
            --output text > /tmp/ssm-start-cid
          echo "async deploy started (log: /home/ubuntu/deploy.log)"

          for i in $(seq 1 60); do
            sleep 15
            CHECK_ID=$(aws ssm send-command \
              --instance-ids "$EC2_INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --parameters 'commands=["tail -20 /home/ubuntu/deploy.log"]' \
              --query "Command.CommandId" \
              --output text)

            # wait for the check command itself to finish before reading output
            for j in $(seq 1 10); do
              STATUS=$(aws ssm get-command-invocation \
                --command-id "$CHECK_ID" \
                --instance-id "$EC2_INSTANCE_ID" \
                --query "Status" \
                --output text)
              if [ "$STATUS" = "Success" ] || [ "$STATUS" = "Failed" ]; then
                break
              fi
              sleep 5
            done

            OUT=$(aws ssm get-command-invocation \
              --command-id "$CHECK_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "StandardOutputContent" \
              --output text)
            echo "check=$OUT (attempt $i)"
            if echo "$OUT" | grep -q "=== deployment done ===" && echo "$OUT" | grep -q "$IMAGE" && echo "$OUT" | grep -q "Up"; then
              echo "deployment succeeded"
              exit 0
            fi
            if echo "$OUT" | grep -q "ERROR"; then
              echo "deploy.sh reported an error:"
              echo "$OUT"
              exit 1
            fi
          done
          echo "deployment timed out after 60 attempts"
          exit 1