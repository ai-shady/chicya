name: Deploy Backend to EC2

on:
  push:
    branches: [main]
    paths:
      - "apps/backend/**"
      - "deploy/**"
      - "Dockerfile"
      - ".dockerignore"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/**"

concurrency:
  group: backend-deploy
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-west-2
  AWS_ACCOUNT: "039314424497"
  ECR_REPOSITORY: medusa-backend
  EC2_INSTANCE_ID: i-0d44c4c8141d1454e

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT }}:role/github-actions-chicya-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci --workspace=@dtc/backend --include-workspace-root

      - name: Build backend (medusa build)
        working-directory: apps/backend
        run: npx medusa build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE="${{ env.AWS_ACCOUNT }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}"
          docker buildx build \
            --platform linux/arm64 \
            --provenance false \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            -t "$IMAGE:$IMAGE_TAG" \
            -t "$IMAGE:latest" \
            --push .
          echo "image=$IMAGE:$IMAGE_TAG" >> "$GITHUB_ENV"

      - name: Deploy via SSM Run Command
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE="${{ env.AWS_ACCOUNT }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG"

          # async deploy: run in background so the ~1.5GB pull is not bounded by
          # the ssm-document-worker's ~80s internal timeout
          aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["rm -f /home/ubuntu/deploy.log; nohup bash /home/ubuntu/deploy.sh '"$IMAGE_TAG"' > /home/ubuntu/deploy.log 2>&1 &"]' \
            --query "Command.CommandId" \
            --output text > /tmp/ssm-start-cid
          echo "async deploy started (log: /home/ubuntu/deploy.log)"

          for i in $(seq 1 60); do
            sleep 15
            CHECK_ID=$(aws ssm send-command \
              --instance-ids "$EC2_INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --parameters 'commands=["tail -20 /home/ubuntu/deploy.log"]' \
              --query "Command.CommandId" \
              --output text)

            # wait for the check command itself to finish before reading output
            for j in $(seq 1 10); do
              STATUS=$(aws ssm get-command-invocation \
                --command-id "$CHECK_ID" \
                --instance-id "$EC2_INSTANCE_ID" \
                --query "Status" \
                --output text)
              if [ "$STATUS" = "Success" ] || [ "$STATUS" = "Failed" ]; then
                break
              fi
              sleep 5
            done

            OUT=$(aws ssm get-command-invocation \
              --command-id "$CHECK_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "StandardOutputContent" \
              --output text)
            echo "check=$OUT (attempt $i)"
            if echo "$OUT" | grep -q "=== deployment done ===" && echo "$OUT" | grep -q "$IMAGE" && echo "$OUT" | grep -q "Up"; then
              echo "deployment succeeded"
              exit 0
            fi
            if echo "$OUT" | grep -q "ERROR"; then
              echo "deploy.sh reported an error:"
              echo "$OUT"
              exit 1
            fi
          done
          echo "deployment timed out after 60 attempts"
          exit 1