services:
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$$REDIS_REQUIREPASS\""]
    environment:
      REDIS_REQUIREPASS: ${REDIS_REQUIREPASS}
    volumes:
      - redis-data:/data
    networks:
      - medusa-net

  medusa:
    image: 039314424497.dkr.ecr.us-west-2.amazonaws.com/medusa-backend:${MEDUSA_IMAGE_TAG}
    container_name: medusa
    restart: unless-stopped
    env_file:
      - /home/ubuntu/medusa-prod.env
    ports:
      - "127.0.0.1:9000:9000"
    networks:
      - medusa-net

networks:
  medusa-net:
    external: true

volumes:
  redis-data:
    external: true